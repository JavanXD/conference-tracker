<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Conference Tracker favicon</title>
  <desc id="desc">Walnut calendar with map pin — conference deadlines and location</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e241c"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#6b5340" stroke-opacity="0.65"/>
  <!-- Calendar -->
  <rect x="14" y="16" width="36" height="34" rx="7" fill="#241c16"/>
  <rect x="14" y="16" width="36" height="11" rx="7" fill="#d2b48c"/>
  <rect x="14" y="22" width="36" height="5" fill="#d2b48c"/>
  <!-- Rings -->
  <rect x="22" y="12" width="3.5" height="10" rx="1.75" fill="#f4eee6"/>
  <rect x="38.5" y="12" width="3.5" height="10" rx="1.75" fill="#f4eee6"/>
  <!-- Pin -->
  <path d="M32 28.5c-4.4 0-8 3.4-8 7.7 0 5.8 8 13.8 8 13.8s8-8 8-13.8c0-4.3-3.6-7.7-8-7.7Z" fill="#e2c9a6"/>
  <circle cx="32" cy="36.2" r="2.9" fill="#1a1410"/>
</svg>
